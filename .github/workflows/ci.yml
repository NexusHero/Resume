name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality gate: format, lint, tests ───────────────────────────────────
  verify:
    name: verify — Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Docs check (diagram/link/ADR freshness)
        run: npm run docs:check

      - name: Test
        run: npm test

      - name: Web unit tests (Vitest)
        run: npm run test:web

  # ── UI acceptance tests (Playwright) ────────────────────────────────────
  e2e:
    name: e2e — Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI acceptance tests
        run: npm run test:e2e

  # ── SQL integration tests against a real Postgres ───────────────────────
  integration:
    name: integration — Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myjob
          POSTGRES_PASSWORD: myjob
          POSTGRES_DB: myjob
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myjob"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SQL integration tests
        # Uses the npm script so Jest is launched with --experimental-vm-modules
        # (the project is ESM, ADR-0042); a bare `npx jest` would fail to parse.
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://myjob:myjob@localhost:5432/myjob

  # ── Conventional Commits on the PR ──────────────────────────────────────
  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: bash scripts/check-conventional-commits.sh "origin/${{ github.base_ref }}" "${{ github.sha }}"
