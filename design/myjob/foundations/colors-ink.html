<!-- @dsCard group="Colors" viewport="700x120" name="Ink scale" subtitle="The dark app shell / sidebar / structural dark" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--surface-card); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; height: 72px; border-radius: var(--radius-sm); display: flex; flex-direction: column; justify-content: flex-end; padding: 7px 9px; box-sizing: border-box; }
  .t { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.86); }
  .h { font-family: var(--font-mono); font-size: 9.5px; color: rgba(255,255,255,0.55); }
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--ink-950)"><span class="t">ink-950</span><span class="h">#080b12</span></div>
  <div class="sw" style="background:var(--ink-900)"><span class="t">ink-900</span><span class="h">#0b1220</span></div>
  <div class="sw" style="background:var(--ink-850)"><span class="t">ink-850</span><span class="h">#0f1626</span></div>
  <div class="sw" style="background:var(--ink-800)"><span class="t">ink-800</span><span class="h">#131c2e</span></div>
  <div class="sw" style="background:var(--ink-700)"><span class="t">ink-700</span><span class="h">#1f2940</span></div>
  <div class="sw" style="background:var(--ink-600)"><span class="t">ink-600</span><span class="h">#2c3852</span></div>
</div>
</body></html>
