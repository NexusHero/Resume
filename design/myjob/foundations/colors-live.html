<!-- @dsCard group="Colors" viewport="700x150" name="Live / Jetzt" subtitle="#FF5320 — theme-independent. Heute anstehende Interviews, laufende Gespräche, der Playhead im Logo. Immer dieses Orange." -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--surface-card); font-family: var(--font-body); display: flex; align-items: center; gap: 18px; }
  .big { width: 150px; height: 78px; border-radius: var(--radius-lg); background: var(--live); display: flex; align-items: flex-end; padding: 8px 10px; box-sizing: border-box; box-shadow: var(--shadow-live); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: #fff; }
  .ex { display: flex; flex-direction: column; gap: 9px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--live-strong); background: var(--live-soft); border: 1px solid var(--live-border); border-radius: var(--radius-pill); padding: 5px 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: p 2.2s ease infinite; }
  @keyframes p { 0%,100% { box-shadow: 0 0 0 0 rgba(255,83,32,.5);} 50% { box-shadow: 0 0 0 6px rgba(255,83,32,0);} }
  .note { font-size: 12px; color: var(--text-soft); max-width: 260px; line-height: 1.5; }
</style></head>
<body>
  <div class="big"><span class="hex">--live · #FF5320</span></div>
  <div class="ex">
    <span class="chip"><span class="dot"></span>Interview morgen · 14:00</span>
    <span class="chip" style="color:#fff;background:var(--live);border-color:var(--live)">LIVE · Gespräch läuft</span>
  </div>
  <p class="note">Nur für Dinge, die JETZT passieren. Nie als Dekoration, nie als Status-Farbe, nie fürs Chrome.</p>
</body></html>
