<!-- @dsCard group="Colors" viewport="700x150" name="People palette" subtitle="8 vivid categorical colors — avatar tiles, skill tags, calendar chips. Deterministic name→color, never chrome." -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--surface-card); font-family: var(--font-body); }
  .row { display: flex; gap: 8px; }
  .p { flex: 1; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .ava { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 600; font-size: 15px; }
  .soft { width: 100%; height: 20px; border-radius: var(--radius-sm); }
  .t { font-family: var(--font-mono); font-size: 9px; color: var(--text-soft); }
</style></head>
<body>
<div class="row">
  <div class="p"><span class="ava" style="background:var(--people-1)">SK</span><span class="soft" style="background:var(--people-1-soft)"></span><span class="t">people-1</span></div>
  <div class="p"><span class="ava" style="background:var(--people-2)">LB</span><span class="soft" style="background:var(--people-2-soft)"></span><span class="t">people-2</span></div>
  <div class="p"><span class="ava" style="background:var(--people-3)">NV</span><span class="soft" style="background:var(--people-3-soft)"></span><span class="t">people-3</span></div>
  <div class="p"><span class="ava" style="background:var(--people-4)">ME</span><span class="soft" style="background:var(--people-4-soft)"></span><span class="t">people-4</span></div>
  <div class="p"><span class="ava" style="background:var(--people-5)">JT</span><span class="soft" style="background:var(--people-5-soft)"></span><span class="t">people-5</span></div>
  <div class="p"><span class="ava" style="background:var(--people-6)">AR</span><span class="soft" style="background:var(--people-6-soft)"></span><span class="t">people-6</span></div>
  <div class="p"><span class="ava" style="background:var(--people-7)">CW</span><span class="soft" style="background:var(--people-7-soft)"></span><span class="t">people-7</span></div>
  <div class="p"><span class="ava" style="background:var(--people-8)">DH</span><span class="soft" style="background:var(--people-8-soft)"></span><span class="t">people-8</span></div>
</div>
</body></html>
