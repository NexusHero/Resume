<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid · --space-1 (2px) → --space-13 (64px)" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-card); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--accent); border-radius: var(--radius-xs); width: 18px; }
  .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-soft); }
</style></head>
<body>
<div class="row">
  <div class="col"><div class="bar" style="height:4px"></div><span class="t">2</span></div>
  <div class="col"><div class="bar" style="height:8px"></div><span class="t">4</span></div>
  <div class="col"><div class="bar" style="height:12px"></div><span class="t">8</span></div>
  <div class="col"><div class="bar" style="height:16px"></div><span class="t">12</span></div>
  <div class="col"><div class="bar" style="height:24px"></div><span class="t">16</span></div>
  <div class="col"><div class="bar" style="height:32px"></div><span class="t">24</span></div>
  <div class="col"><div class="bar" style="height:44px"></div><span class="t">32</span></div>
  <div class="col"><div class="bar" style="height:56px"></div><span class="t">40</span></div>
  <div class="col"><div class="bar" style="height:68px"></div><span class="t">48</span></div>
  <div class="col"><div class="bar" style="height:80px"></div><span class="t">56</span></div>
  <div class="col"><div class="bar" style="height:92px"></div><span class="t">64</span></div>
</div>
</body></html>
