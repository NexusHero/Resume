<!-- @dsCard group="Type" viewport="700x150" name="Mono — JetBrains Mono" subtitle="The engineering signature: dates, tags, kickers, numbers" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-card); display: flex; flex-direction: column; gap: 12px; }
  .kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--accent-strong); }
  .nums { font-family: var(--font-mono); font-size: 28px; font-weight: 600; color: var(--text-heading); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .tags { display: flex; gap: 8px; }
  .tag { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 3px 9px; }
</style></head>
<body>
  <div class="kicker">Pipeline · Q2 2026</div>
  <div class="nums">18 Mandate · 92% Match · €68.000</div>
  <div class="tags"><span class="tag">2021 — heute</span><span class="tag">remote</span><span class="tag">React</span><span class="tag">+12%</span></div>
</body></html>
