<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>myJob Recruit — Bewerbung vorbereiten</title>
<link rel="icon" href="../assets/logo/favicon.svg" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--surface-app); }
  #root { height: 100vh; }

  .prep-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 920px) { .prep-grid { grid-template-columns: 1fr; } }

  .pcard { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; overflow: hidden; }
  .pcard-head { display: flex; align-items: center; gap: 11px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .pcard-head .ic { width: 32px; height: 32px; border-radius: var(--radius-md); display: grid; place-items: center; background: var(--surface-sunk); color: var(--text-muted); flex: none; }
  .pcard-head h3 { font-family: var(--font-display); font-size: var(--fs-md); font-weight: var(--fw-semibold); color: var(--text-heading); margin: 0; letter-spacing: var(--ls-tight); }
  .pcard-head .sub { font-size: var(--fs-xs); color: var(--text-soft); margin-top: 1px; }
  .pcard-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

  /* magic button */
  .magic { position: relative; appearance: none; cursor: pointer; border: none; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 9px; font-family: var(--font-body); font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--accent-contrast); background: var(--accent); border-radius: var(--radius-md); padding: 11px 18px; transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast); box-shadow: 0 1px 2px color-mix(in oklch, var(--accent) 40%, transparent); }
  .magic:hover { transform: translateY(-1px); box-shadow: 0 4px 14px color-mix(in oklch, var(--accent) 38%, transparent); }
  .magic::after { content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, color-mix(in oklch, #fff 45%, transparent), transparent); transform: skewX(-18deg); animation: shimmer 3.2s ease-in-out infinite; }
  @keyframes shimmer { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .magic.ghost { background: transparent; color: var(--accent-strong); border: 1px solid var(--accent-border); box-shadow: none; }
  .magic.ghost::after { display: none; }
  .magic[disabled] { opacity: .5; cursor: default; }
  .magic[disabled]:hover { transform: none; }

  /* steering — prompt the KI */
  .steer { appearance: none; cursor: pointer; font-family: var(--font-body); font-size: var(--fs-xs); font-weight: var(--fw-medium); color: var(--accent-strong); background: transparent; border: 1px solid var(--accent-border); border-radius: var(--radius-pill); padding: 8px 14px; transition: all var(--dur-fast); }
  .steer:hover { background: var(--accent-soft); }
  .steer-in { flex: 1; min-width: 0; font-family: var(--font-body); font-size: var(--fs-sm); color: var(--text-heading); background: var(--surface-card); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 10px 13px; outline: none; }
  .steer-in:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .steer-note { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--accent-strong); background: var(--accent-soft); border-radius: var(--radius-pill); padding: 4px 11px; }

  /* empty / invitation state */
  .invite { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 30px 18px; }
  .invite .halo { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); }
  .invite p { font-size: var(--fs-sm); color: var(--text-soft); max-width: 34ch; margin: 0; }

  /* shimmer skeleton while "generating" */
  .skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-sunk) 25%, var(--surface-subtle) 37%, var(--surface-sunk) 63%); background-size: 400% 100%; animation: load 1.3s ease infinite; }
  @keyframes load { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  /* provenance chip */
  .prov { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: var(--fs-3xs); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wide); text-transform: uppercase; padding: 3px 9px; border-radius: var(--radius-pill); }
  .prov.ai { color: var(--accent-strong); background: var(--accent-soft); }
  .prov.done { color: var(--success); background: var(--success-soft); }

  /* skill chip */
  .skill { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: var(--fs-xs); font-weight: var(--fw-medium); padding: 5px 11px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: transparent; color: var(--text-muted); transition: all var(--dur-fast); user-select: none; }
  .skill.hl { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: var(--fw-semibold); }
  .skill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .cvline { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border-radius: var(--radius-md); border: 1px solid var(--border); transition: all var(--dur-med) var(--ease-out); }
  .cvline.hl { border-color: var(--accent-border); background: var(--accent-soft); }
  .cvline .bullet { width: 6px; height: 6px; border-radius: 50%; background: var(--text-soft); margin-top: 6px; flex: none; }
  .cvline.hl .bullet { background: var(--accent); }
  .cvline .txt { font-size: var(--fs-sm); color: var(--text-body); line-height: 1.45; }
  .cvline .tag { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-3xs); font-weight: var(--fw-semibold); color: var(--accent-strong); white-space: nowrap; flex: none; }

  /* sticky decision footer */
  .decide { position: sticky; bottom: 0; margin-top: 20px; margin-bottom: 4px; background: color-mix(in oklch, var(--paper) 96%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 14px 18px; display: flex; align-items: center; gap: 16px; }
  .decide .checks { display: flex; gap: 16px; flex-wrap: wrap; }
  .decide .ck { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-sm); color: var(--text-muted); }
  .decide .ck .box { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; border: 1px solid var(--border-strong); color: transparent; flex: none; }
  .decide .ck.on .box { background: var(--success); border-color: var(--success); color: #fff; }
  .decide .ck.on { color: var(--text-heading); font-weight: var(--fw-medium); }
  .send { margin-left: auto; appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--accent-contrast); background: var(--accent); border: none; border-radius: var(--radius-md); padding: 11px 18px; transition: opacity var(--dur-fast); }
  .send[disabled] { opacity: .4; cursor: default; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink-800); color: #fff; border: 1px solid rgba(255,255,255,0.14); font-family: var(--font-body); font-size: var(--fs-sm); padding: 12px 20px; border-radius: var(--radius-pill); box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 8px; z-index: 60; }
  .toast b { color: var(--accent-on-dark); }
@media (prefers-reduced-motion: reduce) { .magic::after, .skel, .toast { animation: none; } }
</style>
<script>(function(){try{if(localStorage.getItem('myjob.mode')==='dark'){var e=document.documentElement;e.setAttribute('data-mode','dark');e.setAttribute('data-theme','ember');}}catch(err){}})();</script>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel">
const DS = window.MyJobDesignSystem_5611b7 || window.DesignSystem_5611b7;
const { AppShell, Avatar, Icon, Button, Textarea, StatusBadge } = DS;

const RECRUIT_NAV = [
  { id: 'workspace', label: 'Workspace', icon: 'home' },
  { id: 'pool', label: 'Talent-Pool', icon: 'users' },
  { id: 'stellen', label: 'Stellen', icon: 'briefcase' },
  { id: 'matching', label: 'Matching', icon: 'search' },
  { id: 'pipeline', label: 'Pipeline', icon: 'columns', badge: 2, demo: true },
  { id: 'inbox', label: 'Inbox', icon: 'inbox', badge: 3, demo: true },
];

/* nav routing — Sub-Flows behalten den Eltern-Eintrag (readme ▸ Nav-Regel) */
const NAV_ROUTES = { workspace: 'Workspace.html', pool: 'Talent-Pool.html', stellen: 'Matching.html', matching: 'Matching.html', __settings: 'Settings.html' };
const goNav = (id) => { const t = NAV_ROUTES[id]; if (t) window.location.href = t; };

/* The application being prepared: Suhay × the Helvetia position. */
const CTX = {
  cand: { name: 'Suhay Sevinc', role: 'Full-Stack Developer', photo: '../assets/img/suhay-photo-sm.jpg' },
  job: { title: 'Senior Frontend Engineer', company: 'Helvetia Digital AG', location: 'Zürich', country: 'CH' },
  match: 88,
  required: ['React', 'TypeScript', 'GraphQL', 'CSS Architecture'],
};
const CAND_SKILLS = ['React', 'TypeScript', 'Node.js', 'CSS Architecture', 'GraphQL', 'REST', 'Jest', 'Figma'];
const CV_LINES = [
  { id: 'l1', txt: 'Frontend-Architektur einer React/TypeScript-Plattform (2 Jahre)', rel: true },
  { id: 'l2', txt: 'GraphQL-API-Design für ein Microservice-Backend', rel: true },
  { id: 'l3', txt: 'Aufbau eines Design-Systems mit skalierbarer CSS-Architektur', rel: true },
  { id: 'l4', txt: 'Node.js-Services für interne Tooling-Pipelines', rel: false },
  { id: 'l5', txt: 'Betreuung von Werkstudierenden im Frontend-Team', rel: false },
];

const LETTERS = [
  `Sehr geehrte Damen und Herren,

mit großem Interesse bewerbe ich mich auf die Position als Senior Frontend Engineer bei der Helvetia Digital AG in Zürich.

In den vergangenen Jahren habe ich als Full-Stack Developer tiefe Erfahrung mit React und TypeScript aufgebaut — genau den Technologien, die im Zentrum dieser Rolle stehen. Meine Arbeit an skalierbaren CSS-Architekturen und GraphQL-Schnittstellen deckt sich unmittelbar mit Ihren Anforderungen.

Die Aussicht, bei Helvetia Digital an einem Produkt mit Schweizer Qualitätsanspruch mitzuwirken, reizt mich sehr. Ich bin überzeugt, mit meiner Kombination aus technischer Tiefe und Produktverständnis einen schnellen Beitrag leisten zu können.

Über ein persönliches Gespräch würde ich mich sehr freuen.

Freundliche Grüße
Suhay Sevinc`,
  `Guten Tag,

die Position als Senior Frontend Engineer bei Helvetia Digital hat sofort meine Aufmerksamkeit geweckt — sie trifft genau das, woran ich am liebsten arbeite.

Mit React und TypeScript als täglichem Handwerk und einem Schwerpunkt auf sauberer CSS-Architektur und GraphQL bringe ich die Kernkompetenzen mit, die Sie suchen. In meinem letzten Projekt habe ich eine Frontend-Plattform von Grund auf mitgestaltet und dabei besonders auf Wartbarkeit und Tempo geachtet.

Helvetia Digital steht für Qualität und einen klaren Anspruch — ein Umfeld, in dem ich mich weiterentwickeln und zugleich unmittelbar Wirkung erzielen möchte.

Gerne überzeuge ich Sie in einem Gespräch persönlich.

Freundliche Grüße
Suhay Sevinc`,
];

const Sparkle = (p) => { const C = window.MyJobDesignSystem_5611b7.Sparkle; return C ? <C {...p} /> : <span style={{ width: (p.size||16)+"px", display: "inline-block" }} />; };

/* ---- Card A · Anschreiben ---- */
function LetterCard({ status, setStatus }) {
  const [text, setText] = React.useState('');
  const [variant, setVariant] = React.useState(0);
  const [prompt, setPrompt] = React.useState('');
  const [note, setNote] = React.useState(null);
  const [steering, setSteering] = React.useState(false);

  const generate = (v) => {
    setStatus('gen');
    setTimeout(() => {
      const idx = v != null ? v : variant;
      setText(LETTERS[idx]);
      setStatus('draft');
    }, 1200);
  };
  const regenerate = () => { const next = (variant + 1) % LETTERS.length; setVariant(next); setNote(null); generate(next); };
  /* steer: free-text or chip instruction → real KI rewrite via window.claude; falls back to variant swap without it */
  const steer = async (instr) => {
    const v = (instr || '').trim();
    if (!v || steering) return;
    setPrompt('');
    if (window.claude && window.claude.complete) {
      setSteering(true);
      try {
        const out = await window.claude.complete(
          `Du überarbeitest ein deutsches Bewerbungsanschreiben.\n\nKontext: ${CTX.cand.name} (${CTX.cand.role}) bewirbt sich als ${CTX.job.title} bei ${CTX.job.company} in ${CTX.job.location}. Gefordert: ${CTX.required.join(', ')}. Profil-Skills: ${CAND_SKILLS.join(', ')}.\n\nAktueller Entwurf:\n---\n${text}\n---\n\nAnweisung: „${v}“\n\nÜberarbeite den Entwurf gemäß der Anweisung. Behält Anrede und Grußformel bei, bleibe faktentreu (keine erfundenen Stationen). Antworte NUR mit dem vollständigen überarbeiteten Anschreiben, ohne Kommentar.`
        );
        if (out && out.trim()) { setText(out.trim()); setNote(v); }
      } catch (e) {
        const next = (variant + 1) % LETTERS.length; setVariant(next); setText(LETTERS[next]); setNote(v);
      }
      setSteering(false);
    } else {
      setNote(v);
      const next = (variant + 1) % LETTERS.length; setVariant(next); generate(next);
    }
  };

  return (
    <div className="pcard">
      <div className="pcard-head">
        <span className="ic"><Icon name="mail" size={17} /></span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <h3>Anschreiben</h3>
          <div className="sub">Entwurf aus Profil + Stelle</div>
        </div>
        {status === 'draft' && <span className="prov ai"><Sparkle size={11} />Entwurf · KI</span>}
        {status === 'done' && <span className="prov done"><Icon name="check" size={12} />Bestätigt</span>}
      </div>
      <div className="pcard-body">
        {status === 'idle' && (
          <div className="invite">
            <span className="halo"><Sparkle size={22} /></span>
            <p>myJob entwirft ein Anschreiben aus Suhays Profil und der Stelle. Du prüfst und passt an — abgesendet wird nichts ohne dich.</p>
            <button className="magic" onClick={() => generate()}><Sparkle size={15} />Anschreiben generieren</button>
          </div>
        )}
        {status === 'gen' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', padding: '6px 0' }}>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', color: 'var(--accent-strong)', fontSize: 'var(--fs-sm)', fontWeight: 'var(--fw-medium)', marginBottom: '4px' }}>
              <Sparkle size={14} />myJob schreibt …
            </div>
            {[92, 100, 86, 70, 96, 64].map((w, i) => <div key={i} className="skel" style={{ width: w + '%' }} />)}
          </div>
        )}
        {(status === 'draft' || status === 'done') && (
          <React.Fragment>
            {note && status === 'draft' && !steering && <span className="steer-note"><Sparkle size={11} />Anweisung angewendet: „{note}“</span>}
            {steering && <span className="steer-note"><Sparkle size={11} />myJob passt den Entwurf an …</span>}
            <Textarea rows={13} value={text} readOnly={status === 'done' || steering} onChange={(e) => setText(e.target.value)} style={status === 'done' ? { background: 'var(--surface-subtle)', color: 'var(--text-body)' } : steering ? { opacity: 0.55 } : {}} />
            {status === 'draft' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '9px' }}>
                <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                  {['Formeller', 'Lockerer', 'Kürzer', 'Mehr Schweiz-Bezug'].map((t) => (
                    <button key={t} className="steer" disabled={steering} style={steering ? { opacity: 0.5, cursor: 'wait' } : {}} onClick={() => steer(t)}>{t}</button>
                  ))}
                </div>
                <div style={{ display: 'flex', gap: '8px' }}>
                  <input
                    className="steer-in"
                    placeholder='Eigene Anweisung … z. B. „Betone die GraphQL-Erfahrung“'
                    value={prompt}
                    onChange={(e) => setPrompt(e.target.value)}
                    disabled={steering}
                    onKeyDown={(e) => { if (e.key === 'Enter') steer(prompt); }}
                  />
                  <button className="magic ghost" onClick={() => steer(prompt)} disabled={steering || !prompt.trim()}><Sparkle size={13} />{steering ? 'Passe an …' : 'Anpassen'}</button>
                </div>
              </div>
            )}
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              {status === 'draft' ? (
                <React.Fragment>
                  <button className="magic ghost" onClick={regenerate}><Sparkle size={13} />Neu generieren</button>
                  <span style={{ fontSize: 'var(--fs-xs)', color: 'var(--text-soft)' }}>oder direkt im Feld bearbeiten</span>
                  <button className="magic" style={{ marginLeft: 'auto' }} onClick={() => setStatus('done')}><Icon name="check" size={15} />Übernehmen</button>
                </React.Fragment>
              ) : (
                <button className="magic ghost" style={{ marginLeft: 'auto' }} onClick={() => setStatus('draft')}><Icon name="edit" size={14} />Bearbeiten</button>
              )}
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

/* ---- Card B · CV-Anpassung ---- */
function CvCard({ status, setStatus }) {
  const [highlights, setHighlights] = React.useState({}); // skill -> bool
  const [linesOrder, setLinesOrder] = React.useState(CV_LINES);

  const generate = () => {
    setStatus('gen');
    setTimeout(() => {
      const hl = {};
      CTX.required.forEach((s) => { if (CAND_SKILLS.includes(s)) hl[s] = true; });
      setHighlights(hl);
      setLinesOrder([...CV_LINES].sort((a, b) => (b.rel ? 1 : 0) - (a.rel ? 1 : 0)));
      setStatus('draft');
    }, 950);
  };
  const toggleSkill = (s) => {
    if (status !== 'draft') return;
    setHighlights((p) => ({ ...p, [s]: !p[s] }));
  };
  const hlCount = Object.values(highlights).filter(Boolean).length;

  return (
    <div className="pcard">
      <div className="pcard-head">
        <span className="ic"><Icon name="fileText" size={17} /></span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <h3>CV-Anpassung</h3>
          <div className="sub">Relevante Skills für diese Stelle vorheben</div>
        </div>
        {status === 'draft' && <span className="prov ai"><Sparkle size={11} />{hlCount} hervorgehoben</span>}
        {status === 'done' && <span className="prov done"><Icon name="check" size={12} />Bestätigt</span>}
      </div>
      <div className="pcard-body">
        {status === 'idle' && (
          <div className="invite">
            <span className="halo"><Sparkle size={22} /></span>
            <p>myJob zieht die Skills nach vorn, die diese Stelle verlangt — und ordnet die CV-Punkte passend. Du behältst die Kontrolle über jeden Tag.</p>
            <button className="magic" onClick={generate}><Sparkle size={15} />Skills für diese Stelle vorheben</button>
          </div>
        )}
        {status === 'gen' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', padding: '6px 0' }}>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', color: 'var(--accent-strong)', fontSize: 'var(--fs-sm)', fontWeight: 'var(--fw-medium)', marginBottom: '4px' }}>
              <Sparkle size={14} />gleicht Skills mit der Stelle ab …
            </div>
            {[60, 80, 100, 88].map((w, i) => <div key={i} className="skel" style={{ width: w + '%' }} />)}
          </div>
        )}
        {(status === 'draft' || status === 'done') && (
          <React.Fragment>
            <div>
              <div style={{ fontSize: 'var(--fs-xs)', color: 'var(--text-soft)', marginBottom: '9px' }}>
                Skills {status === 'draft' && <span style={{ color: 'var(--text-muted)' }}>· tippe einen an, um die Hervorhebung zu ändern</span>}
              </div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '7px' }}>
                {CAND_SKILLS.map((s) => (
                  <span key={s} className={'skill' + (highlights[s] ? ' hl' : '')} onClick={() => toggleSkill(s)}>
                    {highlights[s] && <span className="dot" />}{s}
                  </span>
                ))}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 'var(--fs-xs)', color: 'var(--text-soft)', marginBottom: '9px' }}>Erfahrung · relevante zuerst</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                {linesOrder.map((l) => (
                  <div key={l.id} className={'cvline' + (l.rel ? ' hl' : '')}>
                    <span className="bullet" />
                    <span className="txt">{l.txt}</span>
                    {l.rel && <span className="tag">vorgehoben</span>}
                  </div>
                ))}
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              {status === 'draft' ? (
                <button className="magic" style={{ marginLeft: 'auto' }} onClick={() => setStatus('done')}><Icon name="check" size={15} />Übernehmen</button>
              ) : (
                <button className="magic ghost" style={{ marginLeft: 'auto' }} onClick={() => setStatus('draft')}><Icon name="edit" size={14} />Bearbeiten</button>
              )}
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function PrepScreen() {
  const [letter, setLetter] = React.useState('idle');
  const [cv, setCv] = React.useState('idle');
  const [sent, setSent] = React.useState(false);
  const both = letter === 'done' && cv === 'done';

  const ContextBar = (
    <div style={{ display: 'flex', alignItems: 'center', gap: '16px', flexWrap: 'wrap', padding: '16px 18px', background: 'var(--surface-card)', border: '1px solid var(--border)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-sm)', marginBottom: '20px' }}>
      <Avatar name={CTX.cand.name} src={CTX.cand.photo} size="md" ring />
      <div style={{ minWidth: 0 }}>
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--fs-md)', fontWeight: 'var(--fw-semibold)', color: 'var(--text-heading)' }}>{CTX.cand.name}</div>
        <div style={{ fontSize: 'var(--fs-xs)', color: 'var(--text-soft)' }}>{CTX.cand.role}</div>
      </div>
      <Icon name="arrowRight" size={18} style={{ color: 'var(--text-soft)' }} />
      <div style={{ minWidth: 0, flex: 1 }}>
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--fs-md)', fontWeight: 'var(--fw-semibold)', color: 'var(--text-heading)' }}>{CTX.job.title}</div>
        <div style={{ fontSize: 'var(--fs-xs)', color: 'var(--text-soft)' }}>{CTX.job.company} · {CTX.job.location} · {CTX.job.country}</div>
      </div>
      <span style={{ display: 'inline-flex', alignItems: 'center', gap: '7px', fontFamily: 'var(--font-mono)', fontSize: 'var(--fs-sm)', fontWeight: 'var(--fw-semibold)', color: 'var(--accent-strong)', background: 'var(--accent-soft)', border: '1px solid var(--accent-border)', borderRadius: 'var(--radius-pill)', padding: '5px 12px' }}>
        <span style={{ width: '7px', height: '7px', borderRadius: '50%', background: 'var(--accent)' }} />{CTX.match}% Match
      </span>
    </div>
  );

  return (
    <React.Fragment>
      <AppShell
        product="recruit" posture="rail"
        nav={RECRUIT_NAV} active="matching" onNav={goNav}
        account={{ name: 'Suhay Sevinc', meta: 'Ich · +3 Talente', src: '../assets/img/suhay-photo-sm.jpg' }}
        title="Bewerbung vorbereiten"
        subtitle="Magic-Entwürfe · du bestätigst"
      >
        <div style={{ maxWidth: '1000px' }}>
          {ContextBar}
          <div className="prep-grid">
            <LetterCard status={letter} setStatus={setLetter} />
            <CvCard status={cv} setStatus={setCv} />
          </div>
          <div className="decide">
            <div className="checks">
              <span className={'ck' + (letter === 'done' ? ' on' : '')}><span className="box"><Icon name="check" size={12} /></span>Anschreiben</span>
              <span className={'ck' + (cv === 'done' ? ' on' : '')}><span className="box"><Icon name="check" size={12} /></span>CV-Anpassung</span>
            </div>
            <button className="send" disabled={!both} title={!both ? 'Erst Anschreiben und CV-Anpassung übernehmen' : undefined} onClick={() => both && setSent(true)}>
              <Icon name="send" size={15} />Bewerbung absenden
            </button>
          </div>
        </div>
      </AppShell>
      {sent && (
        <div className="toast">
          <Icon name="checkCircle" size={16} />
          Suhay auf „{CTX.job.title}" beworben — <b>in Pipeline</b>
        </div>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PrepScreen />);
</script>
</body>
</html>
