<!-- @template name="App: Splash" description="Animated Now-Split logo splash screen" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>myJob — Splash</title>
<link rel="icon" href="../../assets/logo/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { height: 100%; }
  a { color: var(--royal-on-dark); } a:hover { color: #ffffff; }

  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
    background:
      radial-gradient(90% 70% at 50% 108%, rgba(255, 83, 32, 0.16) 0%, transparent 55%),
      radial-gradient(120% 120% at 50% 0%, #16255c 0%, #0d1330 55%, #0a0c11 100%);
    font-family: var(--font-display);
    overflow: hidden;
  }

  /* ---- The Now-Split mark, built live so it can animate ---- */
  .mark {
    position: relative; width: 148px; height: 148px; border-radius: 34px;
    background: linear-gradient(135deg, #3d5cf5 0%, #2941b8 100%);
    box-shadow: 0 30px 80px -20px rgba(61, 92, 245, 0.6);
    animation: tile-in 4.2s var(--ease-spring) both;
  }
  .blk { position: absolute; top: 55px; width: 35px; height: 42px; border-radius: 10px; }
  .blk.actual { left: 29px; background: #fff; animation: slide-in 4.2s var(--ease-spring) both; }
  .blk.ghost  { left: 84px; border: 4px dashed rgba(255,255,255,0.8); background: none; box-sizing: border-box; animation: fade-in 4.2s ease both; }
  .playhead {
    position: absolute; left: 71px; top: 46px; width: 6px; height: 60px; border-radius: 3px;
    background: var(--live); transform-origin: top center;
    animation: sweep 4.2s var(--ease-out) both;
  }
  .dot {
    position: absolute; left: 66.5px; top: 28px; width: 15px; height: 15px; border-radius: 50%;
    background: var(--live);
    animation: pulse 4.2s ease both;
  }

  .word {
    color: #fff; font-size: 44px; font-weight: 700; letter-spacing: -0.02em;
    animation: rise 4.2s var(--ease-out) both;
  }
  .word .accent { color: var(--live); }
  .tag {
    color: rgba(255,255,255,0.6); font-family: var(--font-body); font-size: 15.5px; margin-top: -18px;
    animation: rise 4.2s var(--ease-out) both;
  }
  .kicker {
    position: absolute; bottom: 42px; left: 0; right: 0; text-align: center;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    animation: rise 4.2s var(--ease-out) both;
  }

  @keyframes tile-in {
    0%       { transform: scale(0.55); opacity: 0; }
    7%       { opacity: 1; }
    12%      { transform: scale(1.05); }
    17%, 100% { transform: scale(1); opacity: 1; }
  }
  @keyframes slide-in {
    0%, 10%   { transform: translateX(-20px); opacity: 0; }
    22%       { transform: translateX(2px); opacity: 1; }
    29%, 100% { transform: translateX(0); opacity: 1; }
  }
  @keyframes fade-in {
    0%, 19%   { opacity: 0; }
    33%, 100% { opacity: 1; }
  }
  @keyframes sweep {
    0%, 15%   { transform: scaleY(0); }
    33%, 100% { transform: scaleY(1); }
  }
  @keyframes pulse {
    0%, 26% { transform: scale(0); }
    35%     { transform: scale(1.35); }
    42%     { transform: scale(1); }
    56%     { transform: scale(1.25); }
    66%, 100% { transform: scale(1); }
  }
  @keyframes rise {
    0%, 26%   { transform: translateY(16px); opacity: 0; }
    42%, 100% { transform: translateY(0); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mark, .blk, .playhead, .dot, .word, .tag, .kicker { animation: none; }
  }
</style>
</head>
<body>
  <div class="stage" data-screen-label="Splash">
    <div class="mark">
      <span class="blk actual"></span>
      <span class="blk ghost"></span>
      <span class="playhead"></span>
      <span class="dot"></span>
    </div>
    <div class="word">my<span class="accent">Job</span></div>
    <div class="tag">Finden. Matchen. Einstellen.</div>
    <div class="kicker">Vermittler-Workspace</div>
  </div>
  <script>
    // Sting läuft einmal und endet sichtbar; zur Demo alle 6s neu abspielen.
    (function () {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var els = document.querySelectorAll('.mark,.blk,.playhead,.dot,.word,.tag,.kicker');
      setInterval(function () {
        els.forEach(function (el) { el.style.animation = 'none'; });
        void document.body.offsetWidth;
        els.forEach(function (el) { el.style.animation = ''; });
      }, 6000);
    })();
  </script>
</body>
</html>
