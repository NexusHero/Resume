<!-- @startingPoint section="myJob" subtitle="Agency platform — mandates, pool, placements + your own resume/cover-letter editor" viewport="1320x860" -->
<!DOCTYPE html>
<!-- data-mode (light/dark) is set by theme.js before paint — it follows the
     saved choice, else the OS preference (#196). The dark boot splash covers the
     brief pre-hydration window, so there's no flash under the strict CSP. -->
<html lang="en" data-theme="royal">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>myJob — Application tool</title>
<!-- PWA: installable to the home screen with an offline app shell (ADR-0028). -->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#0b1220" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="myJob" />
<!-- Inline favicon (the myJob bars mark) — no extra request, kills the /favicon.ico 404. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1424'/%3E%3Crect x='7' y='13' width='4' height='12' rx='2' fill='%233b82f6'/%3E%3Crect x='14' y='7' width='4' height='18' rx='2' fill='%23f97316'/%3E%3Crect x='21' y='10' width='4' height='9' rx='2' fill='%233b82f6'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { height: 100%; margin: 0; }
  /* 100dvh tracks the *dynamic* viewport (the mobile URL bar collapsing in and
     out), so the shell fills the screen without a dead strip or body scroll;
     100vh is the fallback for engines without dvh (#202). */
  #root { height: 100vh; height: 100dvh; }
  /* Boards scroll horizontally inside their own container on a phone; snap each
     column to the start so paging feels deliberate, and keep momentum on iOS.
     The next column peeks past the edge as the "there's more" affordance (#202). */
  .board-scroll { -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .board-scroll::-webkit-scrollbar { display: none; }
  .board-col-snap { scroll-snap-align: start; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { transform: translate(-50%, -50%) scale(0.96); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 3px solid var(--surface-app); }
  @media (max-width: 720px) { .auth-brand { display: none !important; } }

  /* ---- Keyboard accessibility (#203) ---- */
  /* A consistent accent focus ring on every keyboard-focused control. Many
     controls set `outline:none` inline for the mouse; :focus-visible only fires
     for keyboard focus, and !important restores the ring over those inline
     styles — so pointer users see nothing extra, keyboard users always see where
     they are. */
  :focus-visible {
    outline: 2px solid var(--accent) !important;
    outline-offset: 2px !important;
    border-radius: var(--radius-sm, 6px);
  }
  /* Skip-to-content link: off-screen until focused, then a visible chip. */
  .skip-link {
    position: fixed; top: 8px; left: 8px; z-index: 200;
    transform: translateY(-160%); transition: transform var(--dur-fast, .15s) ease;
    background: var(--accent); color: var(--accent-contrast, #fff);
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    padding: 10px 16px; border-radius: var(--radius-md, 10px); text-decoration: none;
    box-shadow: var(--shadow-lg);
  }
  .skip-link:focus { transform: translateY(0); }

  /* ---- Boot splash: a branded equalizer that paints instantly (before React),
       then app.jsx fades it out once the session resolves. Colours are hard-coded
       so it looks right before the theme CSS variables apply. ---- */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 700px at 50% 32%, #14203c 0%, #0b1120 55%, #070b14 100%);
    opacity: 1; transition: opacity .55s ease, transform .55s ease; overflow: hidden;
  }
  #splash.splash-hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
  #splash::before, #splash::after {
    content: ''; position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%;
    filter: blur(80px); opacity: .35; pointer-events: none; will-change: transform;
  }
  #splash::before { background: #3654e0; top: -12vmax; left: -6vmax; animation: splashAura 9s ease-in-out infinite alternate; }
  #splash::after  { background: #ff5320; bottom: -14vmax; right: -8vmax; opacity: .22; animation: splashAura 11s ease-in-out infinite alternate-reverse; }
  @keyframes splashAura { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(4vmax,3vmax,0) scale(1.15); } }
  .splash-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; animation: splashRise .6s cubic-bezier(.16,1,.3,1) both; }
  @keyframes splashRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .splash-mark { display: flex; align-items: flex-end; gap: 9px; height: 76px; }
  .splash-mark .bar { width: 15px; border-radius: 6px; transform-origin: bottom; will-change: transform;
    animation: splashEq 1.05s ease-in-out infinite; }
  .splash-mark .b1 { height: 52px; background: #3654e0; box-shadow: 0 0 22px rgba(54,84,224,.55); animation-delay: 0s; }
  .splash-mark .b2 { height: 76px; background: #ff5320; box-shadow: 0 0 26px rgba(255,83,32,.55); animation-delay: .18s; }
  .splash-mark .b3 { height: 40px; background: #90a0ff; box-shadow: 0 0 22px rgba(144,160,255,.5); animation-delay: .36s; }
  @keyframes splashEq { 0%,100% { transform: scaleY(.42); } 50% { transform: scaleY(1); } }
  .splash-word { font-family: 'Space Grotesk', var(--font-display, ui-sans-serif), system-ui, sans-serif;
    font-weight: 700; font-size: 40px; letter-spacing: -.02em; color: #f8fafc; line-height: 1; }
  .splash-word .accent { color: #f97316; }
  .splash-tag { font-family: 'JetBrains Mono', var(--font-mono, ui-monospace), monospace;
    font-size: 11px; letter-spacing: .34em; text-transform: uppercase; color: #7c8aa5; margin-top: -6px; }
  .splash-progress { width: 168px; height: 3px; border-radius: 999px; background: rgba(148,163,184,.18); overflow: hidden; margin-top: 6px; }
  .splash-progress > span { display: block; width: 42%; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, transparent, #3b82f6 40%, #f97316 90%); animation: splashBar 1.25s ease-in-out infinite; }
  @keyframes splashBar { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) {
    #splash::before, #splash::after, .splash-mark .bar, .splash-progress > span, .splash-inner { animation: none; }
    .splash-mark .b1 { height: 52px; } .splash-mark .b2 { height: 76px; } .splash-mark .b3 { height: 40px; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <!-- Boot splash — painted immediately; app.jsx removes it once the session
       resolves. aria-hidden: it's decorative and transient, and a role here would
       collide with the app's own role="status" elements in tests. -->
  <div id="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="splash-mark" aria-hidden="true">
        <span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span>
      </div>
      <div class="splash-word"><span class="accent">my</span>Job</div>
      <div class="splash-tag">Recruiting Suite</div>
      <div class="splash-progress" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <!-- Vite bundles React + compiles the JSX at build time (no CDN, no runtime Babel). -->
  <script type="module" src="./main.jsx"></script>
</body>
</html>
