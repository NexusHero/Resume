# Local production-like stack: the app on Postgres (STORE=sql).
# Recruiting data (mandates/talents/placements), applications, audit and saved
# searches go to Postgres; the user/session store and PDF archive are file-backed
# in the mounted volume. Tables are created on boot (migrate()).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myjob
      POSTGRES_PASSWORD: myjob
      POSTGRES_DB: myjob
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myjob']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      PORT: 4178
      STORE: sql
      DATABASE_URL: postgres://myjob:myjob@db:5432/myjob
      # Fixed local/demo secret so this compose file boots out of the box —
      # it is NOT safe for a real deployment. Generate your own (e.g. via
      # `openssl rand -base64 32`) and set it here (or better, via a secret
      # store / env file that isn't checked into git) in production:
      APP_SECRET: 'local-dev-example-secret-71O4u8jID-RWFtEcThDC6t6Iwb3KNke3-CHANGE-ME'
      # Restrict CORS to your real origin(s) in production (comma-separated):
      # CORS_ORIGINS: https://app.example.com
    ports:
      - '4178:4178'
    volumes:
      - app-archive:/app/archive
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:4178/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  db-data:
  app-archive:
