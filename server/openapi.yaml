      summary: List all tenants with member counts (super-admin)
      operationId: listTenants
      description: |
        The super-admin console (ADR-0037). Gated on the instance-level
        super-admin capability (configured `SUPER_ADMIN_EMAIL`); a tenant admin
        gets 403. Includes the implicit default team when it has members.
      security:
        - cookieSession: []
      responses:
        '200':
          description: Every tenant, oldest first, with its member count.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TenantOverview' }
