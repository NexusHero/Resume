        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Team]
      summary: Suspend or reactivate a tenant (super-admin)
      operationId: setTenantStatus
      description: |
        Suspending a tenant kills its members' sessions and blocks their login
        (ADR-0038). The implicit default team has no record and cannot be
        suspended (404).
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
