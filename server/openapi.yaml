      responses:
        '200':
          description: What the sweep considered and anonymized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  overdue: { type: integer }
                  anonymized: { type: integer }
                  talentIds: { type: array, items: { type: string } }
