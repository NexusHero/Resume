openapi: 3.1.0
info:
  title: myJob Recruiting Suite API
  version: 2.0.0
  description: |
    The REST API behind the **myJob** recruiting workspace: mandates, talent
    pool, pipeline (candidacies), placements, the document editor (résumé +
    cover letter, PDF/dossier export), AI assistance (parse, ATS, pitch,
    outreach, translation, match explanations, interview kits, candidate
    prep), team accounts with roles, per-user AI settings/usage and DSGVO
    tooling — plus the applicant-side application log and job search.

    ### Authentication
    Cookie sessions. `POST /auth/register` or `POST /auth/login` set an
    opaque, HttpOnly session cookie; authenticated endpoints return
    `401` (problem+json) without it. There are no API tokens.

    ### Errors
    Errors follow RFC 9457 `application/problem+json` — see the `Problem`
    schema. Validation failures return `400`, missing/foreign records `404`,
    missing session `401`, missing role `403`, rejected upstream AI keys `502`.

    ### AI features
    One central server key per provider (ADR-0057). Every AI feature meters
    token spend per user and answers `503 ai-not-configured` when no key is
    configured — there is no template fallback. A failed or unusable provider
    reply is `502`. LLM-backed responses carry a `usage` object (tokens +
    estimated USD) so clients can show what a call cost.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Auth
    description: Registration, login, sessions, email verification, password reset
  - name: Talents
    description: The shared team talent pool
  - name: Mandates
    description: Client mandates (searches) incl. matching and AI helpers
  - name: Pipeline
    description: Candidacies — a talent's progress through one mandate's stages
  - name: Placements
  - name: Documents
    description: Per-talent résumé + cover letter, PDF/dossier export, AI assistance
  - name: Attachments
  - name: Jobs & Applications
    description: Job search and the applicant-side application log
  - name: Saved searches
  - name: Job postings
    description: Saved job postings ("Stellen") — adopt from search, paste text, or fetch a URL (SSRF-guarded)
  - name: Assistant
    description: The in-process agent — settings, manual runs, and the reviewable suggestion queue
  - name: Agent
    description: The chat agent — a streamed tool-use loop over the saved postings, pool and applications (drafts only)
  - name: Artifacts
    description: The outcome loop — generated AI artifacts and what became of them
  - name: Mail
    description: Email integration — send drafted outreach, detect replies for the outcome loop
  - name: Settings
    description: AI provider choice, per-user API keys, usage
  - name: Team
    description: Members and roles (admin)
  - name: Compliance & DSGVO
  - name: Reports

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account (and start a session)
      description: |
        The first account of an instance becomes `admin`; later ones are
        `recruiter`. Sends a verification email (soft — nothing is locked
        while unverified). Sets the session cookie.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account created; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '409':
          description: The email is already registered.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/accept-invite:
    post:
      tags: [Auth]
      summary: Accept a tenant invitation (create the account, start a session)
      description: |
        The invitee sets a password against a valid invite token; the new
        account is created bound to the inviting tenant and its roles, and the
        session cookie is set. Single-use — expired or unknown tokens are 401.
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Account created; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401':
          description: The invitation is invalid, already used, or expired.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: An account with this email already exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
            example: { email: recruiter@example.com, password: 's3cret-passphrase' }
      responses:
        '200':
          description: Signed in; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
              example:
                user:
                  id: usr_8Wq2aF
                  email: recruiter@example.com
                  roles: [recruiter]
                  createdAt: '2026-06-01T09:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out (revokes the server-side session)
      operationId: logout
      responses:
        '204': { description: Session revoked; cookie cleared. }

  /auth/me:
    get:
      tags: [Auth]
      summary: 'The signed-in user (or `user: null`)'
      operationId: me
      responses:
        '200':
          description: The current session's user; `null` without a session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/User'
                      - type: 'null'
                  plan:
                    type: string
                    enum: [free, pro]
                    description: The instance-wide subscription plan (ADR-0021).
                  isSuperAdmin:
                    type: boolean
                    description: Whether the user holds the instance-level super-admin capability (ADR-0037).

  /auth/providers:
    get:
      tags: [Auth]
      summary: Which auth mechanisms are available
      operationId: authProviders
      responses:
        '200':
          description: Password auth availability (no OAuth providers yet).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /auth/verify-email/request:
    post:
      tags: [Auth]
      summary: (Re-)send the verification email to the signed-in user
      operationId: requestEmailVerification
      security:
        - cookieSession: []
      responses:
        '202': { description: Verification email queued. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/verify-email/confirm:
    post:
      tags: [Auth]
      summary: Confirm the emailed verification token
      operationId: confirmEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Email verified; the user now carries `verifiedAt`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request a password-reset email
      description: Always `202` — whether the address exists is never revealed.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: If the account exists, a reset email was sent. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Set a new password with the emailed token
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '204': { description: Password replaced; all sessions revoked. }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /talents:
    get:
      tags: [Talents]
      summary: List the talent pool
      description: |
        Each talent carries `effectiveSkills` — stored skills merged with the
        skills their saved documents prove, canonicalized — which is what
        Matching scores against.
      operationId: listTalents
      security:
        - cookieSession: []
      responses:
        '200':
          description: All talents in the team pool.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Talent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Talents]
      summary: Add a talent
      operationId: createTalent
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TalentInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  talent: { $ref: '#/components/schemas/Talent' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /talents/import:
    post:
      tags: [Talents]
      summary: Bulk-import CVs (PDF) as talents
      description: >
        Parse each uploaded PDF CV into a new talent (contact, résumé, skills),
        reusing the single-CV parse path. Each file is handled independently —
        a failure is reported and the batch continues; a talent that fails after
        creation is rolled back. Bounded to 20 files per request.
      operationId: importTalents
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [dataBase64]
                    properties:
                      dataBase64: { type: string, description: Base64-encoded PDF bytes }
                      filename: { type: string, default: '' }
      responses:
        '201':
          description: Per-file import results (order matches the request).
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      oneOf:
                        - type: object
                          properties:
                            ok: { type: boolean, enum: [true] }
                            talentId: { type: string }
                            name: { type: string }
                            skillCount: { type: integer }
                            provider: { type: string }
                            extractedChars: { type: integer }
                        - type: object
                          properties:
                            ok: { type: boolean, enum: [false] }
                            filename: { type: string }
                            error: { type: string }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /talents/{id}:
    patch:
      tags: [Talents]
      summary: Update a talent (partial)
      operationId: updateTalent
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TalentInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  talent: { $ref: '#/components/schemas/Talent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Talents]
      summary: Delete a talent (cascades to documents, attachments, candidacies)
      operationId: deleteTalent
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /talents/{id}/anonymize:
    post:
      tags: [Compliance & DSGVO]
      summary: Anonymize a talent (DSGVO erasure that keeps the statistics)
      operationId: anonymizeTalent
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: Personal fields blanked; pipeline/statistics rows kept.
          content:
            application/json:
              schema:
                type: object
                properties:
                  talent: { $ref: '#/components/schemas/Talent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /talents/{id}/candidacies:
    get:
      tags: [Pipeline]
      summary: A talent's candidacies across all mandates
      operationId: candidaciesForTalent
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The talent's pipeline rows (with mandate context).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Candidacy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /talents/{id}/documents:
    get:
      tags: [Documents]
      summary: The talent's stored documents (contact, résumé, letter, style)
      operationId: getDocuments
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The stored document set (empty defaults if never saved).
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { $ref: '#/components/schemas/TalentDocuments' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Documents]
      summary: Save the talent's documents (the editor's autosave)
      operationId: saveDocuments
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TalentDocuments' }
      responses:
        '200':
          description: Saved (missing fields are filled with defaults).
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { $ref: '#/components/schemas/TalentDocuments' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /talents/{id}/documents/pdf:
    get:
      tags: [Documents]
      summary: Render the documents as a PDF (résumé + letter)
      operationId: documentsPdf
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The rendered PDF (inline).
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /talents/{id}/dossier/pdf:
    get:
      tags: [Documents]
      summary: Render the client dossier (documents + selected attachments)
      operationId: dossierPdf
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/id'
        - name: attachments
          in: query
          required: false
          description: Comma-separated attachment ids to merge into the PDF.
          schema: { type: string }
      responses:
        '200':
          description: The merged dossier PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /talents/{id}/documents/ai:
    post:
      tags: [Documents]
      summary: 'AI tailor: rewrite the summary or draft cover-letter paragraphs'
      description: Output language follows the candidate's documents. Requires the central AI key; without one the route answers 503.
      operationId: aiSuggest
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [summary, letter] }
                company: { type: string }
                role: { type: string }
      responses:
        '200':
          description: The staged suggestion (applied client-side on Accept).
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion: { $ref: '#/components/schemas/AiSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamProblem' }

  /talents/{id}/documents/parse:
    post:
      tags: [Documents]
      summary: Parse pasted CV text into structured contact + résumé
      operationId: parseCv
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 100000 }
      responses:
        '200':
          description: The parsed structure (raw text kept as summary without a provider).
          content:
            application/json:
              schema:
                type: object
                properties:
                  parsed: { $ref: '#/components/schemas/ParsedDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamProblem' }

  /talents/{id}/documents/parse-pdf:
    post:
      tags: [Documents]
      summary: Parse an uploaded CV PDF (text layer) into structured fields
      operationId: parseCvPdf
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataBase64]
              properties:
                dataBase64: { type: string, description: Base64-encoded PDF bytes. }
      responses:
        '200':
          description: |
            The parsed structure; `extractedChars: 0` marks a scanned/image-only
            PDF (nothing to parse — paste the text instead).
          content:
            application/json:
              schema:
                type: object
                properties:
                  parsed:
                    allOf:
                      - $ref: '#/components/schemas/ParsedDocument'
                      - type: object
                        properties:
                          extractedChars: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamProblem' }

  /talents/{id}/documents/ats:
    post:
      tags: [Documents]
      summary: Score the résumé against a job ad (ATS check)
      operationId: atsScore
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobText]
              properties:
                jobText: { type: string, maxLength: 50000 }
      responses:
        '200':
          description: Score, matched/missing keywords and concrete suggestions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ats: { $ref: '#/components/schemas/AtsScore' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamProblem' }

  /talents/{id}/documents/pitch:
    post:
      tags: [Documents]
      summary: Draft a "why this candidate" pitch for the client
      description: Grounding-checked — unsupported factual claims are flagged.
      operationId: pitchCandidate
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mandateContext: { type: string, maxLength: 50000 }
            example:
              mandateContext: Senior C++ Engineer at Aurora GmbH, Berlin — low-latency trading systems.
      responses:
        '200':
          description: Headline, paragraphs, highlights + grounding report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pitch: { $ref: '#/components/schemas/Pitch' }
              example:
                pitch:
                  headline: 8 years of low-latency C++ — a strong fit for Aurora's trading desk
                  paragraphs:
                    - Lena has shipped production C++17 order-routing systems handling 200k msg/s …
                  highlights: [C++17, low-latency, order routing]
                  provider: gemini
                  usage: { inputTokens: 1180, outputTokens: 240, costUsd: 0.0011 }
                  grounding:
                    supported: [C++17, low-latency]
                    unsupported: [] # empty → nothing to correct before sending
        '401': { $ref: '#/components/responses/Unauthorized' }
        # Representative Pro gate (ADR-0021); every generative route returns this
        # on a Free plan. Full per-route annotation follows when the plan goes live.
        '402': { $ref: '#/components/responses/PlanRequired' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }
        '502': { $ref: '#/components/responses/UpstreamProblem' }

  /talents/{id}/documents/outreach:
    post:
      tags: [Documents]
      summary: Draft a first-contact message (candidate/client, email/LinkedIn)
      operationId: outreachMessage
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                audience: { type: string, enum: [candidate, client], default: candidate }
                channel: { type: string, enum: [email, linkedin], default: email }
                tone: { type: string, maxLength: 80, example: 'locker, Du' }
                mandateContext: { type: string, maxLength: 50000 }
                recruiterName: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Subject (email only) + body, grounding-checked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/OutreachMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }
        '502': { $ref: '#/components/responses/UpstreamProblem' }

  /talents/{id}/documents/translate:
    post:
      tags: [Documents]
      summary: Create the other-language variant of the documents (EN↔DE)
      description: |
        Idempotent — an existing variant is returned with `created: false`.
        Requires an AI provider; without a key the API asks for one (`400`)
        instead of fabricating a translation.
      operationId: translateDocuments
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lang]
              properties:
                lang: { type: string, enum: [en, de] }
      responses:
        '200':
          description: The stored translation variant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lang: { type: string, enum: [en, de] }
                  created: { type: boolean }
                  translation: { type: object, additionalProperties: true }
                  usage: { $ref: '#/components/schemas/CallUsage' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamProblem' }

  /talents/{id}/attachments:
    get:
      tags: [Attachments]
      summary: List a talent's attachments
      operationId: listAttachments
      security:
