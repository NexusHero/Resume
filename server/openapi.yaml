        '502': { $ref: '#/components/responses/UpstreamProblem' }

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: myjob_session
      description: Opaque HttpOnly session cookie set by register/login.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    talentId:
      name: talentId
      in: path
      required: true
      schema: { type: string }
    provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [claude, gemini] }

  responses:
    ValidationProblem:
      description: The request failed validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: No (valid) session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The session lacks the required role.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such record in the caller's scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Too many attempts — try again later.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UpstreamProblem:
      description: The AI provider rejected the request (e.g. an invalid API key).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
      additionalProperties: true

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [admin, recruiter] }
        createdAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time }

    ProviderId:
      type: string
      description: Which backend produced the result; `template` = deterministic fallback, no AI.
      enum: [claude, gemini, template]

    CallUsage:
      type: object
      description: What one LLM call cost. Absent on template results — nothing was spent.
      properties:
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        costUsd:
          type: number
          description: Estimate from public list prices, not a bill.

    Grounding:
      type: object
      description: Self-check flagging factual claims the CV + mandate do not support.
      properties:
        grounded: { type: boolean }
        unsupported:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [number, skill] }
              text: { type: string }

    Talent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        headline: { type: string }
        location: { type: string }
        email: { type: string }
        phone: { type: string }
        availability: { type: string }
        salary: { type: string }
        skills: { type: array, items: { type: string } }
        effectiveSkills:
          type: array
          items: { type: string }
          description: Stored skills merged with what the documents prove (canonicalized).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TalentInput:
      type: object
      properties:
        name: { type: string }
        role: { type: string }
        headline: { type: string }
        location: { type: string }
        email: { type: string }
        phone: { type: string }
        availability: { type: string }
        salary: { type: string }
        skills: { type: array, items: { type: string } }

    Mandate:
      allOf:
        - $ref: '#/components/schemas/MandateInput'
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    MandateInput:
      type: object
      properties:
        client: { type: string }
        role: { type: string }
        location: { type: string }
        fee: { type: string, example: '25%' }
        feeValue: { type: string, example: '28.000 €' }
        deadline: { type: string }
        priority: { type: string, enum: [high, medium, low], default: medium }
        status: { type: string, enum: [active, paused, closed], default: active }
        submitted: { type: integer, minimum: 0 }
        interviews: { type: integer, minimum: 0 }
        jobText:
          type: string
          maxLength: 50000
          description: The job ad — powers matching, ATS, prep and the language of AI output.

    CandidacyStage:
      type: string
      enum: [sourced, screening, interview, offer, placed, rejected]

    Candidacy:
      type: object
      properties:
        id: { type: string }
        mandateId: { type: string }
        talentId: { type: string }
        stage: { $ref: '#/components/schemas/CandidacyStage' }
        note: { type: string }
        order: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: true

    Placement:
      allOf:
        - $ref: '#/components/schemas/PlacementInput'
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    PlacementInput:
      type: object
      properties:
        candidateName: { type: string }
        candidateRole: { type: string }
        client: { type: string }
        start: { type: string }
        fee: { type: string }
        status: { type: string, enum: [probation, invoiced, paid], default: probation }

    Attachment:
      type: object
      properties:
        id: { type: string }
        talentId: { type: string }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer }

    TalentDocuments:
      type: object
      description: The editor's document set. All parts are optional on save; missing fields get defaults.
      properties:
        contact:
          type: object
          additionalProperties: true
          description: Name, role, email, phone, location, links, photo (data URI).
        resume:
          type: object
          properties:
            summary: { type: string }
            experience:
              type: array
              items:
                type: object
                properties:
                  role: { type: string }
                  company: { type: string }
                  period: { type: string }
                  location: { type: string }
                  bullets: { type: array, items: { type: string } }
                  skills: { type: array, items: { type: string } }
            education:
              type: array
              items: { type: object, additionalProperties: true }
            skillGroups:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  items: { type: array, items: { type: string } }
        letter:
          type: object
          properties:
            firma: { type: string }
            betreff: { type: string }
            absaetze: { type: array, items: { type: string } }
        style: { type: object, additionalProperties: true }
        translations: { type: object, additionalProperties: true }

    AiSuggestion:
      type: object
      properties:
        action: { type: string, enum: [summary, letter] }
        text: { type: string, description: Present for a summary suggestion. }
        paragraphs:
          type: array
          items: { type: string }
          description: Present for a cover-letter suggestion.
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }

    ParsedDocument:
      type: object
      properties:
        contact: { type: object, additionalProperties: true }
        resume: { type: object, additionalProperties: true }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }

    AtsScore:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        matched: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        suggestions: { type: array, items: { type: string } }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }

    Pitch:
      type: object
      properties:
        headline: { type: string }
        paragraphs: { type: array, items: { type: string } }
        highlights: { type: array, items: { type: string } }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }
        grounding: { $ref: '#/components/schemas/Grounding' }

    OutreachMessage:
      type: object
      properties:
        subject: { type: string, description: Empty for LinkedIn DMs. }
        body: { type: string }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }
        grounding: { $ref: '#/components/schemas/Grounding' }

    MatchResult:
      type: object
      properties:
        talentId: { type: string }
        name: { type: string }
        role: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        matched: { type: array, items: { type: string } }
        inPipeline: { type: boolean }
      additionalProperties: true

    CandidatePrep:
      type: object
      properties:
        companyLabel: { type: string }
        companySource: { type: string, enum: [archetype, observed] }
        companyConfidence: { type: string, enum: [low, medium, high] }
        formats: { type: array, items: { type: string } }
        emphasis: { type: array, items: { type: string } }
        rounds: { type: string }
        obligations: { type: array, items: { type: string } }
        processHints: { type: array, items: { type: string } }
        strengths: { type: array, items: { type: string } }
        requirementChecks:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              covered: { type: boolean }
        likelyQuestions:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              question: { type: string }
              why: { type: string }
        starAnswers:
          type: array
          items:
            type: object
            properties:
              competency: { type: string }
              prompt: { type: string }
              scaffold: { type: string }
        candidateQuestions: { type: array, items: { type: string } }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }

    SavedSearch:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        q: { type: string }
        city: { type: string }
        country: { type: string }
        threshold: { type: integer }

    LlmSettings:
      type: object
      properties:
        current: { type: string, enum: [claude, gemini] }
        providers:
          type: array
          items:
            type: object
            properties:
              id: { type: string, enum: [claude, gemini] }
              label: { type: string }
              available:
                type: boolean
                description: Whether the server holds credentials for it (user keys are separate).

    UsageBucket:
      type: object
      properties:
        requests: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        totalTokens: { type: integer }
        costUsd: { type: number }

    UsageSummary:
      allOf:
        - $ref: '#/components/schemas/UsageBucket'
        - type: object
          properties:
            byProvider:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/UsageBucket'
                  - type: object
                    properties:
                      provider: { type: string }
            byFeature:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/UsageBucket'
                  - type: object
                    properties:
                      feature: { type: string }
