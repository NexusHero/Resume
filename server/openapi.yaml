              properties:
                text: { type: string, maxLength: 50000 }
      responses:
        '200':
          description: Findings with the offending term, issue and a suggestion.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /compliance/agg-rewrite:
    post:
      tags: [Compliance & DSGVO]
      summary: Produce a neutral draft of AGG-risk text (writing aid)
      description: >-
        Deterministically replaces every flagged phrase that has a safe neutral
        rewrite; phrases with no safe automatic fix are returned in `unresolved`.
      operationId: aggRewrite
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 50000 }
      responses:
        '200':
          description: The rewritten text plus the edits made and anything unresolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  changed: { type: boolean }
                  edits:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { type: string }
                        from: { type: string }
                        to: { type: string }
                  unresolved: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /forecast:
    get:
      tags: [Reports]
      summary: Weighted pipeline revenue forecast across live mandates
      description: >-
        Forecast v2: the stage-probability curve is learned from the desk's own
        resolved candidacies (stage-transition log) once a stage has enough
        samples; below that it stays on the transparent industry default. The
        response always declares each probability's source.
      operationId: forecast
      security:
        - cookieSession: []
      responses:
        '200':
          description: Stage-weighted expected fees plus the curve used.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  totalWeighted: { type: integer }
                  totalFaceValue: { type: integer }
                  mandates:
                    type: array
                    items: { type: object, additionalProperties: true }
                  probabilities:
                    type: array
                    items:
                      type: object
                      properties:
                        stage:
                          type: string
                          enum: [sourced, screening, interview, offer]
                        probability: { type: number }
                        source:
                          type: string
                          enum: [observed, default]
                        sample:
                          type: integer
                          description: Resolved journeys that passed through this stage.
                        wins:
                          type: integer
                          description: …of which ended in a placement.
                  insights:
                    type: array
                    description: Per-client interview→placement conversion (min. 3 resolved interviews).
                    items:
                      type: object
                      properties:
                        client: { type: string }
                        interviews: { type: integer }
                        placements: { type: integer }
                        rate: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /assistant:
    get:
      tags: [Assistant]
      summary: The assistant's settings and queue counts
      operationId: assistantOverview
      security:
        - cookieSession: []
      responses:
        '200':
          description: Persisted settings + counts per suggestion status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/AssistantSettings' }
                  counts:
                    type: object
                    properties:
                      proposed: { type: integer }
                      accepted: { type: integer }
                      dismissed: { type: integer }
                      autoApplied: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }
    put:
      tags: [Assistant]
      summary: Update the assistant's settings (persisted; survives restarts)
      operationId: assistantUpdateSettings
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                mode:
                  type: string
                  enum: [suggest, act, autopilot]
                  description: >-
                    suggest = everything waits for review; act = internal reversible
                    actions are applied directly (auto-applied); autopilot = additionally
                    builds full application packets for strong matches and stages them
                    (spends AI tokens; ADR-0019).
                applySource:
                  type: string
                  enum: [jobs, mandates]
                  description: Autopilot's opening source — received job postings or own mandates.
                minApplyScore: { type: integer, minimum: 0, maximum: 100 }
                intervalMinutes: { type: integer, minimum: 15, maximum: 1440 }
      responses:
        '200':
          description: The updated settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/AssistantSettings' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /assistant/run:
    post:
      tags: [Assistant]
      summary: Run the playbook now (the scheduler runs it in the background too)
      operationId: assistantRun
      security:
        - cookieSession: []
      responses:
        '200':
          description: What the run staged / applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId: { type: string }
                  proposed: { type: integer }
                  applied: { type: integer }
        '400':
          description: The assistant is switched off.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /assistant/suggestions:
    get:
      tags: [Assistant]
      summary: The suggestion queue (newest first, all statuses)
      operationId: assistantSuggestions
      security:
        - cookieSession: []
      responses:
        '200':
          description: Every suggestion with title, rationale and status.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssistantSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /assistant/suggestions/{id}/accept:
    post:
      tags: [Assistant]
      summary: Accept a suggestion (applies its action, e.g. add to the pipeline)
      operationId: assistantAccept
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The resolved suggestion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion: { $ref: '#/components/schemas/AssistantSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }
        '409':
          description: Already resolved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /assistant/suggestions/{id}/dismiss:
    post:
      tags: [Assistant]
      summary: Dismiss a suggestion (it will not be proposed again)
      operationId: assistantDismiss
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The resolved suggestion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion: { $ref: '#/components/schemas/AssistantSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }
        '409':
          description: Already resolved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /assistant/suggestions/{id}/dossier.pdf:
    get:
      tags: [Assistant]
      summary: The staged application's Bewerbungsmappe (tailored CV + cover letter + Zeugnisse)
      description: Renders from the application snapshot; the candidate's stored documents are never mutated (ADR-0019).
      operationId: assistantApplicationDossier
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The application dossier as a PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /artifacts:
    get:
      tags: [Artifacts]
      summary: Generated artifacts (outreach, pitch), newest first
      operationId: listArtifacts
      security:
        - cookieSession: []
      parameters:
        - name: talentId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The artifact log (optionally filtered to one talent).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArtifactLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /artifacts/stats:
    get:
      tags: [Artifacts]
      summary: Reply rates by kind, provider and channel
      operationId: artifactStats
      security:
        - cookieSession: []
      responses:
        '200':
          description: Aggregates; replyRate is null while nothing is resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  byKind:
                    type: array
                    items: { $ref: '#/components/schemas/ArtifactBucket' }
                  byProvider:
                    type: array
                    items: { $ref: '#/components/schemas/ArtifactBucket' }
                  byChannel:
                    type: array
                    items: { $ref: '#/components/schemas/ArtifactBucket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /artifacts/{id}/outcome:
    post:
      tags: [Artifacts]
      summary: Stamp what became of an artifact
      operationId: setArtifactOutcome
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [pending, replied, no-reply, converted]
      responses:
        '200':
          description: The updated artifact.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact: { $ref: '#/components/schemas/ArtifactLog' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /talents/{id}/outreach/send:
    post:
      tags: [Mail]
      summary: Send a drafted outreach email to the talent's address
      description: >-
        Delivers via the configured transport (console in dev, SMTP in
        production). Fails with 400 when the talent has no email address.
      operationId: sendOutreach
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
      responses:
        '200':
          description: The mail was handed to the transport.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  to: { type: string }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /mail/sync-replies:
    post:
      tags: [Mail]
      summary: One reply-detection pass over the configured IMAP mailbox
      description: >-
        Fetches inbox mail since the oldest pending email outreach and stamps
        every artifact whose talent has since written back as `replied`.
        Requires MAIL_IMAP_HOST; also runs on a server-side schedule.
      operationId: syncMailReplies
      security:
        - cookieSession: []
      responses:
        '200':
          description: What the pass looked at and stamped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked: { type: integer, description: Pending email outreach considered. }
                  messages: { type: integer, description: Inbox messages inspected. }
                  replies: { type: integer, description: Artifacts stamped as replied. }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /mail/status:
    get:
      tags: [Mail]
      summary: How mail is wired (send transport, reply sync)
      operationId: mailStatus
      security:
        - cookieSession: []
      responses:
        '200':
          description: The mail configuration relevant to the UI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sendTransport: { type: string, enum: [console, smtp] }
                  replySync: { type: boolean }
                  pollMinutes: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFoundOrNotEnabled' }

  /settings/llm:
    get:
      tags: [Settings]
      summary: The server's central AI provider status (ADR-0057)
      description: >-
        Reports the server's configured providers and their availability. There
        is one central key per server; per-user keys and the per-user provider
        choice were removed. Generative routes answer 503 `ai-not-configured`
        when no provider is available.
      operationId: getLlmSettings
      responses:
        '200':
          description: The server's provider status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmSettings' }

    put:
      tags: [Settings]
      summary: Choose the caller's preferred AI provider (among available ones)
      operationId: updateLlmSettings
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { $ref: '#/components/schemas/ProviderId' }
      responses:
        '200':
          description: The updated server status for this caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmSettings' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings/workspace:
    get:
      tags: [Settings]
      summary: The workspace's feature settings (ADR-0057)
      operationId: getWorkspaceSettings
      security:
        - cookieSession: []
      responses:
        '200':
          description: The workspace feature flags.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Settings]
      summary: Flip the intermediary switch (workspace admin only)
      description: >-
        Turns the intermediary (`vermittlung`) features on or off. When off,
        their routes answer 404 problem+json and their nav entries are hidden;
        data is preserved. Only a workspace admin may change it (403 otherwise).
      operationId: updateWorkspaceSettings
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceSettings' }
      responses:
        '200':
          description: The updated workspace settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSettings' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /settings/usage:
    get:
      tags: [Settings]
      summary: The caller's AI usage (requests, tokens, estimated cost)
      operationId: usageSummary
      security:
        - cookieSession: []
      responses:
        '200':
          description: Totals plus per-provider and per-feature breakdowns.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings/usage/audit:
    get:
      tags: [Settings]
      summary: The caller's per-call AI audit trail (KI-Audit-Trail)
      operationId: usageAudit
      security:
        - cookieSession: []
      responses:
        '200':
          description: One entry per metered AI call, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    at: { type: string }
                    provider: { $ref: '#/components/schemas/ProviderId' }
                    feature: { type: string }
                    inputTokens: { type: integer }
                    outputTokens: { type: integer }
                    costUsd: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings/usage/audit.csv:
    get:
      tags: [Settings]
      summary: The AI audit trail as a downloadable CSV
      operationId: usageAuditCsv
      security:
        - cookieSession: []
      responses:
        '200':
          description: Quoted, Excel-safe CSV (header + one row per call).
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cover-letter:
    post:
      tags: [Documents]
      summary: Generate a tailored cover letter (applicant flow)
      description: >-
        Requires a signed-in session (breaking change, ADR-0057). Generates with
        the server's central key; without one it answers 503 ai-not-configured
        instead of template text.
      operationId: coverLetter
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company, role]
              properties:
                company: { type: string }
                role: { type: string }
                city: { type: string }
                skills: { type: array, items: { type: string } }
      responses:
        '200':
          description: The letter text and which backend produced it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  provider: { $ref: '#/components/schemas/ProviderId' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/AiNotConfigured' }
        '502': { $ref: '#/components/responses/UpstreamProblem' }

  /agent/chat:
    post:
      tags: [Agent]
      summary: Run (or continue) a chat-agent turn over the tool-use loop
      description: |
        Streams an agent run over Server-Sent Events (`text/event-stream`). The
        first event is `session` (`{ sessionId }`), then `text` deltas, `tool-call`
        / `tool-result` / `tool-error`, a `drafts` list, `usage`, and a terminal
        `done` / `limit` / `aborted` / `error`. Without a central AI key the route
        answers `503` **before** the first SSE byte; a foreign `sessionId` answers
        `404` before streaming. The agent only ever creates `draft` applications —
        it cannot send, delete, change status or unfreeze.
      operationId: agentChat
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChatSessionInput' }
      responses:
        '200':
          description: The streamed agent run (Server-Sent Events).
          content:
            text/event-stream:
              schema:
                type: string
                description: An `event:`/`data:` SSE stream (see the endpoint description).
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AiNotConfigured' }
    get:
      tags: [Agent]
      summary: List the caller's chat sessions (metadata)
      operationId: listChatSessions
      security:
        - cookieSession: []
      responses:
        '200':
          description: The caller's sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatSessionMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/chat/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Agent]
      summary: Get one chat session's full transcript
      operationId: getChatSession
      security:
        - cookieSession: []
      responses:
        '200':
          description: The session with its full message transcript.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: '#/components/schemas/ChatSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Agent]
      summary: Delete one chat session
      operationId: deleteChatSession
      security:
        - cookieSession: []
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/chat/{id}/abort:
    post:
      tags: [Agent]
      summary: Abort a running chat-agent run (idempotent)
      operationId: abortChatRun
      security:
        - cookieSession: []
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The run was aborted (or no run was active).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [aborted] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: myjob_session
      description: Opaque HttpOnly session cookie set by register/login.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    talentId:
      name: talentId
      in: path
      required: true
      schema: { type: string }
    provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [claude, gemini] }

  responses:
    ValidationProblem:
      description: The request failed validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: 'client is required'
    Unauthorized:
      description: No (valid) session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Sign in to continue.
    Forbidden:
      description: The session lacks the required role.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: This action requires an admin role.
    PlanRequired:
      description: The feature needs a higher subscription plan (ADR-0021). `type` is `about:blank#plan-required`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank#plan-required
            title: Payment Required
            status: 402
            detail: This feature requires the Pro plan.
    NotFound:
      description: No such record in the caller's scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Talent tal_9Qz not found
    Frozen:
      description: The application is frozen (status is not draft) and needs an explicit `?unfreeze=1` confirmation. `type` is `about:blank#frozen`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank#frozen
            title: Frozen
            status: 409
            detail: Diese Bewerbung ist versendet und eingefroren. Bestätige die Änderung, um fortzufahren.
    RateLimited:
      description: Too many attempts — try again later.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Too many attempts. Please wait a few minutes and try again.
    AiNotConfigured:
      description: No central AI provider is configured on this server (ADR-0057).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank#ai-not-configured
            title: AI not configured
            status: 503
            detail: No AI provider is configured on this server. Set ANTHROPIC_API_KEY or GEMINI_API_KEY.

    NoTextLayer:
      description: The uploaded PDF has no readable text layer (e.g. a scan or protected file).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank#no-text-layer
            title: No text layer
            status: 422
            detail: The PDF contains no readable text (e.g. a scan or protected file).

    NotFoundOrNotEnabled:
      description: Unknown resource, or the feature is not enabled for this workspace.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    UpstreamProblem:
      description: The AI provider rejected the request (e.g. an invalid API key).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    SsrfBlocked:
      description: The URL targets a network address that is not allowed (AK-1.4). `type` is `about:blank#ssrf-blocked`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank#ssrf-blocked
            title: SSRF blocked
            status: 400
            detail: The URL targets a network address that is not allowed.

    NoText:
      description: The page yielded no usable posting text (a login/JS-only page) (AK-1.5). `type` is `about:blank#no-text`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank#no-text
            title: No text
            status: 422
            detail: The page contains no usable posting text.

    PostingFetch:
      description: Fetching the posting failed (timeout, size/redirect limit, DNS/network error, non-2xx). The `reason` is folded into `detail`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank#posting-fetch
            title: Posting fetch failed
            status: 502
            detail: 'Could not fetch the posting (redirect-limit).'

    UpstreamProvider:
      description: The AI provider could not produce a usable result. `type` is `about:blank#upstream-provider`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank#upstream-provider
            title: UpstreamProviderError
            status: 502
            detail: The AI provider could not produce a usable result.

    AlreadyExisting:
      description: The resource already existed (idempotent create) — returns the existing one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobApplicationCreateResult' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
      additionalProperties: true

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [admin, recruiter] }
        createdAt: { type: string, format: date-time }
        tenantId:
          type: string
          description: The tenant the account belongs to; absent means the default single tenant `team` (ADR-0033).
        verifiedAt: { type: string, format: date-time }

    Tenant:
      type: object
      description: A tenant workspace record (ADR-0036).
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, description: ISO 8601; empty for the synthesised default team. }
        status: { type: string, enum: [active, suspended] }

    TenantOverview:
      allOf:
        - $ref: '#/components/schemas/Tenant'
        - type: object
          description: A tenant as the super-admin console sees it (ADR-0037) — the record plus its member count.
          properties:
            memberCount: { type: integer }

    TenantInviteView:
      type: object
      description: A pending tenant invitation (ADR-0035). Never carries the token — that is a secret shared only via the accept link.
      properties:
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [admin, recruiter] }
        invitedBy: { type: string, description: The inviting admin's user id. }
        createdAt: { type: string, format: date-time }

    ProviderId:
      type: string
      description: Which central AI backend produced the result. There is no `template` (ADR-0057).
      enum: [claude, gemini]

    CallUsage:
      type: object
      description: What one LLM call cost. Present on every AI-generated result.
      properties:
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        costUsd:
          type: number
          description: Estimate from public list prices, not a bill.

    Grounding:
      type: object
      description: Self-check flagging factual claims the CV + mandate do not support.
      properties:
        grounded: { type: boolean }
        unsupported:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [number, skill, year, degree] }
              text: { type: string }

    Talent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        headline: { type: string }
        location: { type: string }
        email: { type: string }
        phone: { type: string }
        availability: { type: string }
        salary: { type: string }
        skills: { type: array, items: { type: string } }
        effectiveSkills:
          type: array
          items: { type: string }
          description: Stored skills merged with what the documents prove (canonicalized).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TalentInput:
      type: object
      properties:
        name: { type: string }
        role: { type: string }
        headline: { type: string }
        location: { type: string }
        email: { type: string }
        phone: { type: string }
        availability: { type: string }
        salary: { type: string }
        skills: { type: array, items: { type: string } }

    Mandate:
      allOf:
        - $ref: '#/components/schemas/MandateInput'
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    MandateInput:
      type: object
      properties:
        client: { type: string }
        role: { type: string }
        location: { type: string }
        fee: { type: string, example: '25%' }
        feeValue: { type: string, example: '28.000 €' }
        deadline: { type: string }
        priority: { type: string, enum: [high, medium, low], default: medium }
        status: { type: string, enum: [active, paused, closed], default: active }
        submitted: { type: integer, minimum: 0 }
        interviews: { type: integer, minimum: 0 }
        jobText:
          type: string
          maxLength: 50000
          description: The job ad — powers matching, ATS, prep and the language of AI output.

    CandidacyStage:
      type: string
      enum: [sourced, screening, interview, offer, placed, rejected]

    Candidacy:
      type: object
      properties:
        id: { type: string }
        mandateId: { type: string }
        talentId: { type: string }
        stage: { $ref: '#/components/schemas/CandidacyStage' }
        note: { type: string }
        order: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: true

    Placement:
      allOf:
        - $ref: '#/components/schemas/PlacementInput'
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    PlacementInput:
      type: object
      properties:
        candidateName: { type: string }
        candidateRole: { type: string }
        client: { type: string }
        start: { type: string }
        fee:
          type: string
          description: A monetary amount (currency symbol + digits + grouping), or empty. Free text is rejected (400).
          example: '19.000 €'
        status: { type: string, enum: [probation, invoiced, paid], default: probation }

    Attachment:
      type: object
      properties:
        id: { type: string }
        talentId: { type: string }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer }

    TalentDocuments:
      type: object
      description: The editor's document set. All parts are optional on save; missing fields get defaults.
      properties:
        contact:
          type: object
          additionalProperties: true
          description: Name, role, email, phone, location, links, photo (data URI).
        resume:
          type: object
          properties:
            summary: { type: string }
            rawText:
              type: string
              maxLength: 50000
              description: >-
                Internal raw CV source kept by the text-only import. Exported in
                the GDPR export, never rendered or sent in AI prompts, cleared on
                anonymisation.
            experience:
              type: array
              items:
                type: object
                properties:
                  role: { type: string }
                  company: { type: string }
                  period: { type: string }
                  location: { type: string }
                  bullets: { type: array, items: { type: string } }
                  skills: { type: array, items: { type: string } }
            education:
              type: array
              items: { type: object, additionalProperties: true }
            skillGroups:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  items: { type: array, items: { type: string } }
        letter:
          type: object
          properties:
            firma: { type: string }
            betreff: { type: string }
            absaetze: { type: array, items: { type: string } }
        style: { type: object, additionalProperties: true }
        translations: { type: object, additionalProperties: true }

    AiSuggestion:
      type: object
      properties:
        action: { type: string, enum: [summary, letter] }
        text: { type: string, description: Present for a summary suggestion. }
        paragraphs:
          type: array
          items: { type: string }
          description: Present for a cover-letter suggestion.
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }

    ParsedDocument:
      type: object
      properties:
        contact: { type: object, additionalProperties: true }
        resume: { type: object, additionalProperties: true }
        mode:
          type: string
          enum: [text, ai]
          description: >-
            `text` = "Text übernehmen (ohne KI)" (full CV text in resume.rawText,
            no provider); `ai` = structured by the model.
        truncated:
          type: boolean
          description: Text mode only — the CV exceeded the 50,000-character limit.
        attachmentId:
          type: string
          description: Bulk import text mode only — the stored PDF attachment.
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }

    AtsScore:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        matched: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        suggestions: { type: array, items: { type: string } }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }

    Pitch:
      type: object
      properties:
        headline: { type: string }
        paragraphs: { type: array, items: { type: string } }
        highlights: { type: array, items: { type: string } }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }
        grounding: { $ref: '#/components/schemas/Grounding' }

    OutreachMessage:
      type: object
      properties:
        subject: { type: string, description: Empty for LinkedIn DMs. }
        body: { type: string }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }
        grounding: { $ref: '#/components/schemas/Grounding' }

    MatchResult:
      type: object
      properties:
        talentId: { type: string }
        name: { type: string }
        role: { type: string }
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Hybrid fit — 70% skill/ontology score + 30% text similarity (ADR-0017).
        skillScore: { type: integer, minimum: 0, maximum: 100 }
        semanticScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Local embedding similarity between the job ad and the candidate's profile text.
        matched: { type: array, items: { type: string } }
        inPipeline: { type: boolean }
      additionalProperties: true

    CandidatePrep:
      type: object
      properties:
        companyLabel: { type: string }
        companySource: { type: string, enum: [archetype, observed] }
        companyConfidence: { type: string, enum: [low, medium, high] }
        formats: { type: array, items: { type: string } }
        emphasis: { type: array, items: { type: string } }
        rounds: { type: string }
        obligations: { type: array, items: { type: string } }
        processHints: { type: array, items: { type: string } }
        strengths: { type: array, items: { type: string } }
        requirementChecks:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              covered: { type: boolean }
        likelyQuestions:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              question: { type: string }
              why: { type: string }
        starAnswers:
          type: array
          items:
            type: object
            properties:
              competency: { type: string }
              prompt: { type: string }
              scaffold: { type: string }
        candidateQuestions: { type: array, items: { type: string } }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }

    SavedSearch:
      type: object
      properties:
        id: { type: string }
        ownerId:
          type: string
          description: The owning workspace scope (RI15/Q6).
        name: { type: string }
        q: { type: string }
        city: { type: string }
        country: { type: string }
        threshold: { type: integer }

    JobPosting:
      type: object
      properties:
        id: { type: string }
        ownerId:
          type: string
          description: The owning workspace scope.
        source:
          type: string
          description: Which source supplied the posting (e.g. "Bundesagentur", "text", "url").
        sourceId:
          type: string
          description: The source's id (BA refnr, Arbeitnow slug). Absent for pasted/URL postings.
        url:
          type: string
          format: uri
        company: { type: string }
        title: { type: string }
        location: { type: string }
        country: { type: string }
        description:
          type: string
          description: The full ad text. Empty + `descriptionIncomplete` when the source lacks it.
        requirements:
          type: array
          items: { type: string }
        descriptionIncomplete:
          type: boolean
          description: The source delivered no full text → the UI offers "Text ergänzen".
        createdAt: { type: string }

    JobPostingCreateResult:
      type: object
      properties:
        jobPosting: { $ref: '#/components/schemas/JobPosting' }
        alreadySaved:
          type: boolean
          description: True when a posting with the same dedup key already existed.

    AdoptJobPostingInput:
      type: object
      required: [source, company, title]
      properties:
        source: { type: string }
        sourceId: { type: string }
        url: { type: string, format: uri }
        company: { type: string }
        title: { type: string }
        location: { type: string }
        country: { type: string }
        requirements: { type: array, items: { type: string } }

    CreateJobPostingInput:
      type: object
      required: [source, company, title]
      properties:
        source: { type: string }
        sourceId: { type: string }
        url: { type: string, format: uri }
        company: { type: string }
        title: { type: string }
        location: { type: string }
        country: { type: string }
        description: { type: string }
        requirements: { type: array, items: { type: string } }

    ExtractJobPostingInput:
      description: Exactly one of `text` or `url`.
      type: object
      properties:
        text: { type: string, maxLength: 50000 }
        url: { type: string, format: uri }

    UpdateJobPostingInput:
      type: object
      properties:
        company: { type: string }
        title: { type: string }
        location: { type: string }
        country: { type: string }
        description: { type: string }
        requirements: { type: array, items: { type: string } }
        descriptionIncomplete: { type: boolean }

    JobPostingDraft:
      type: object
      description: The edit draft the extract endpoints return (never persisted). `url` is omitted for `fromText`.
      properties:
        company: { type: string }
        title: { type: string }
        location: { type: string }
        country: { type: string }
        requirements: { type: array, items: { type: string } }
        description: { type: string }
        source: { type: string, enum: [text, url] }
        url: { type: string, format: uri }

    JobApplication:
      type: object
      description: A Bewerbung (Stelle × Mandant) with its own document copy and status history (ADR-0059).
      properties:
        id: { type: string }
        ownerId: { type: string, description: The owning workspace scope. }
        jobPostingId:
          type: string
          description: Soft reference to the posting (no cascade — deleting the posting leaves this intact).
        postingCompany: { type: string, description: Snapshot of the posting's company. }
        postingTitle: { type: string, description: Snapshot of the posting's title. }
        talentId: { type: string }
        talentName: { type: string, description: Name snapshot for display after anonymisation. }
        status: { $ref: '#/components/schemas/JobApplicationStatus' }
        statusHistory: { type: array, items: { $ref: '#/components/schemas/StatusHistoryEntry' } }
        documents: { $ref: '#/components/schemas/TalentDocuments' }
        selectedAttachmentIds:
          type: array
          items: { type: string }
          description: The PDF-only attachments selected for the Bewerbungsmappe (never the reference CV by default).
        createdAt: { type: string }
        updatedAt: { type: string }

    JobApplicationStatus:
      type: string
      enum: [draft, sent, interview, offer, rejected]

    CreateChatSessionInput:
      type: object
      required: [message]
      properties:
        sessionId: { type: string, description: Continue an existing session. }
        message: { type: string, minLength: 1 }

    ChatMessage:
      type: object
      description: One persisted chat message — user/assistant prose, a tool step, or a tool outcome.
      properties:
        role: { type: string, enum: [user, assistant, tool, system] }
        text: { type: string }
        toolCall:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            args: { type: object, additionalProperties: true }
        toolResult:
          type: object
          properties:
            toolCallId: { type: string }
            name: { type: string }
            content: { type: string }
            isError: { type: boolean }
        createdAt: { type: string, format: date-time }

    ChatSession:
      type: object
      description: A persisted, per-user chat session (workspace + user scoped, ADR-0062).
      properties:
        id: { type: string }
        ownerId: { type: string, description: The owning workspace scope. }
        userId: { type: string, description: The owning user. }
        title: { type: string }
        messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        status: { type: string, enum: [running, done, aborted, limit-reached, error] }
        usage:
          type: object
          properties:
            inputTokens: { type: integer }
            outputTokens: { type: integer }
            costUsd: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ChatSessionMeta:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [running, done, aborted, limit-reached, error] }
        updatedAt: { type: string, format: date-time }
        messageCount: { type: integer }

    StatusHistoryEntry:
      type: object
      properties:
        status: { $ref: '#/components/schemas/JobApplicationStatus' }
        at: { type: string, description: ISO 8601 timestamp of the change. }
        note:
          type: string
          description: Set only when a frozen application was force-edited (AK-4.5).

    JobApplicationCreateResult:
      type: object
      properties:
        jobApplication: { $ref: '#/components/schemas/JobApplication' }
        alreadyExisting:
          type: boolean
          description: True when an application for this posting + talent already existed.

    CreateJobApplicationInput:
      type: object
      required: [jobPostingId, talentId]
      properties:
        jobPostingId: { type: string }
        talentId: { type: string }

    ChangeJobApplicationStatusInput:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/JobApplicationStatus' }

    UpdateJobApplicationAttachmentsInput:
      type: object
      required: [attachmentIds]
      properties:
        attachmentIds:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1 }
          description: The PDF attachment ids selected for the Bewerbungsmappe.

    ApplicationLetterResult:
      type: object
      description: A generated Anschreiben with its provider, call usage, grounding self-check and formal quality checks.
      properties:
        paragraphs: { type: array, items: { type: string } }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }
        grounding: { $ref: '#/components/schemas/Grounding' }
        checks:
          type: object
          properties:
            mentionsCompany: { type: boolean }
            mentionsTitle: { type: boolean }
            wordCount: { type: integer }
            references: { type: integer }
            inAdLanguage: { type: boolean }

    PenSection:
      type: string
      description: The four CV sections the Magic Pen rewrites.
      enum: [headline, summary, experienceBullets, skills]

    PenAllSection:
      type: string
      description: The sections `pen/all` aggregates — the four CV sections plus the letter slot.
      enum: [headline, summary, experienceBullets, skills, letter]

    PenExperienceInput:
      type: object
      required: [experienceIndex]
      properties:
        experienceIndex:
          type: integer
          minimum: 0
          description: The zero-based index of the experience station to rewrite.

    PenSuggestion:
      type: object
      description: A per-section before/after suggestion (never persisted).
      properties:
        section: { $ref: '#/components/schemas/PenSection' }
        before:
          description: The copy value at request time (string, string[] or skill groups).
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
            - { type: array, items: { type: object, additionalProperties: true } }
        after:
          description: The generated value (string, string[] or skill groups).
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
            - { type: array, items: { type: object, additionalProperties: true } }
        experienceIndex:
          type: integer
          description: Only for experienceBullets — which station this rewrites.
        station:
          type: object
          description: The immutable station context (role/company/period).
          properties:
            role: { type: string }
            company: { type: string }
            period: { type: string }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }
        grounding: { $ref: '#/components/schemas/Grounding' }

    PenLetterSuggestion:
      type: object
      description: The letter slot of `pen/all` (reuses the application-letter generation).
      properties:
        section: { type: string, enum: [letter] }
        before: { type: array, items: { type: string } }
        after: { type: array, items: { type: string } }
        provider: { $ref: '#/components/schemas/ProviderId' }
        usage: { $ref: '#/components/schemas/CallUsage' }
        grounding: { $ref: '#/components/schemas/Grounding' }
        checks:
          type: object
          properties:
            mentionsCompany: { type: boolean }
            mentionsTitle: { type: boolean }
            wordCount: { type: integer }
            references: { type: integer }
            inAdLanguage: { type: boolean }

    PenAllErrorSlot:
      type: object
      description: A failed section of `pen/all`, reported as an error slot instead of a 500.
      properties:
        error:
          type: object
          properties:
            type: { type: string }
            detail: { type: string }

    PenAllEntry:
      description: One aggregate entry — a section suggestion, the letter slot, or an error slot.
      oneOf:
        - $ref: '#/components/schemas/PenSuggestion'
        - $ref: '#/components/schemas/PenLetterSuggestion'
        - $ref: '#/components/schemas/PenAllErrorSlot'
      discriminator:
        propertyName: section
        mapping:
          headline: '#/components/schemas/PenSuggestion'
          summary: '#/components/schemas/PenSuggestion'
          experienceBullets: '#/components/schemas/PenSuggestion'
          skills: '#/components/schemas/PenSuggestion'
          letter: '#/components/schemas/PenLetterSuggestion'

    PenAllResult:
      type: object
      description: The aggregate of `POST /pen/all` — one entry per station + headline/summary/skills + letter.
      properties:
        sections:
          type: array
          items: { $ref: '#/components/schemas/PenAllEntry' }

    LlmSettings:
      type: object
      properties:
        configured:
          type: boolean
          description: True when at least one provider has a central server key.
        current:
          type: string
          nullable: true
          enum: [claude, gemini, null]
        providers:
          type: array
          items:
            type: object
            properties:
              id: { type: string, enum: [claude, gemini] }
              label: { type: string }
              available:
                type: boolean
                description: Whether the server holds the central key for it (ADR-0057).

    WorkspaceSettings:
      type: object
      description: Per-workspace feature flags (ADR-0057).
      required: [vermittlung]
      properties:
        vermittlung:
          type: boolean
          description: >-
            When true, the intermediary features (Suchaufträge, Pipeline,
            Platzierungen, Performance, Postfach, CoRecruiter) are reachable;
            when false (the default) their routes answer 404.

    UsageBucket:
      type: object
      properties:
        requests: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        totalTokens: { type: integer }
        costUsd: { type: number }

    RetentionPolicy:
      type: object
      properties:
        reviewDays:
          type: integer
          description: Inactivity (days) after which a candidate is flagged for review.
        deletionDays:
          type: integer
          description: Inactivity (days) after which a candidate is overdue for anonymization.
        autoAnonymize:
          type: boolean
          description: When true, the server anonymizes overdue candidates on a schedule.

    UsageSummary:
      allOf:
        - $ref: '#/components/schemas/UsageBucket'
        - type: object
          properties:
            byProvider:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/UsageBucket'
                  - type: object
                    properties:
                      provider: { type: string }
            byFeature:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/UsageBucket'
                  - type: object
                    properties:
                      feature: { type: string }

    AssistantSettings:
      type: object
      properties:
        enabled: { type: boolean }
        mode:
          type: string
          enum: [suggest, act, autopilot]
        applySource:
          type: string
          enum: [jobs, mandates]
        minApplyScore: { type: integer }
        intervalMinutes: { type: integer }
        lastRunAt: { type: string, format: date-time }

    AssistantSuggestion:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [shortlist-add, follow-up, data-gap] }
        title: { type: string }
        rationale: { type: string }
        mandateId: { type: string }
        talentId: { type: string }
        payload: { type: object, additionalProperties: true }
        status: { type: string, enum: [proposed, accepted, dismissed, auto-applied] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        runId: { type: string }

    ArtifactLog:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [outreach, pitch] }
        talentId: { type: string }
        provider: { type: string, description: Which central AI backend produced it. }
        channel: { type: string, description: email / linkedin; empty for pitches. }
        audience: { type: string, description: candidate / client; empty for pitches. }
        outcome: { type: string, enum: [pending, replied, no-reply, converted] }
        createdAt: { type: string, format: date-time }
        outcomeAt: { type: string, format: date-time }

    ArtifactBucket:
      type: object
      properties:
        kind: { type: string }
        provider: { type: string }
        channel: { type: string }
        sent: { type: integer }
        replied: { type: integer }
        noReply: { type: integer }
        converted: { type: integer }
        pending: { type: integer }
        replyRate:
          type: [integer, 'null']
          description: Percent over resolved artifacts; null while nothing is resolved.
