  /retention/policy:
    get:
      tags: [Compliance & DSGVO]
      summary: The team's retention policy (review window, deletion deadline, auto-anonymize)
      operationId: getRetentionPolicy
      security:
        - cookieSession: []
      responses:
        '200':
          description: The stored policy (or defaults until one is set).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Compliance & DSGVO]
      summary: Update the retention policy (admin)
      description: >-
        The review window is clamped to at most the deletion deadline. Enabling
        `autoAnonymize` lets a server-side sweep anonymize overdue candidates in
        the background (ADR-0018).
      operationId: updateRetentionPolicy
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewDays: { type: integer, minimum: 1, maximum: 3650 }
                deletionDays: { type: integer, minimum: 1, maximum: 3650 }
                autoAnonymize: { type: boolean }
      responses:
        '200':
          description: The updated policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPolicy' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

